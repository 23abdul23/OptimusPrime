name: optimusPrime
services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: ghcr.io/mizzoudbl/tbep-frontend
    container_name: optimus-frontend
    restart: 'always'
    env_file:
      - frontend/.env
    ports:
      - "3000:80"

  gsea:
    build: 
      context: gsea
      dockerfile: Dockerfile
    image: ghcr.io/mizzoudbl/tbep-gsea
    container_name: gsea
    restart: 'always'
    ports:
      - "5000:5000"
  
  nestjs:
    build:
      context: backend
      dockerfile: Dockerfile
    image: ghcr.io/mizzoudbl/tbep-nestjs
    container_name: optimus-backend
    # Change this if running on local to avoid restarting on failure
    restart: 'always'
    ports:
      - "4000:4000"
    depends_on:
      - redis
      - clickhouse
    env_file:
      - backend/.env
    environment:
      - NEO4J_URI=${OPTIMUS_NEO4J_URI:-bolt://host.docker.internal:17687}
      - NEO4J_USERNAME=${OPTIMUS_NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${OPTIMUS_NEO4J_PASSWORD:-optimus-password}
      - NEO4J_DATABASE=${OPTIMUS_NEO4J_DATABASE:-neo4j}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  redis:
    image: redis:8.2-alpine
    container_name: optimus-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: 'always'
    volumes:
      - redis-cache:/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: optimus-clickhouse
    restart: always
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./scripts/data/backup:/backup
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}

volumes:
  redis-cache:
  clickhouse-data:
