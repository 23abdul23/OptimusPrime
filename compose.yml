name: optimusPrime
services:
  optimus-neo4j:
    image: neo4j:5.26-community
    container_name: optimus-neo4j
    restart: 'always'
    ports:
      - "17474:7474"
      - "17687:7687"
    environment:
      - NEO4J_AUTH=${OPTIMUS_NEO4J_USERNAME:-neo4j}/${OPTIMUS_NEO4J_PASSWORD:-optimus-password}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./optimusKG.dump:/backups/optimusKG.dump:ro

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: ghcr.io/mizzoudbl/tbep-frontend
    container_name: optimus-frontend
    restart: 'always'
    env_file:
      - frontend/.env
    ports:
      - "3000:80"

  
  nestjs:
    build:
      context: backend
      dockerfile: Dockerfile
    image: ghcr.io/mizzoudbl/tbep-nestjs
    container_name: optimus-backend
    # Change this if running on local to avoid restarting on failure
    restart: 'always'
    ports:
      - "4000:4000"
    depends_on:
      - optimus-neo4j
      - redis
    env_file:
      - backend/.env
    environment:
      - NEO4J_URI=${OPTIMUS_NEO4J_URI:-bolt://optimus-neo4j:7687}
      - NEO4J_USERNAME=${OPTIMUS_NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${OPTIMUS_NEO4J_PASSWORD:-optimus-password}
      - NEO4J_DATABASE=${OPTIMUS_NEO4J_DATABASE:-optimusKG}
  
  redis:
    image: redis:8.2-alpine
    container_name: optimus-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: 'always'
    volumes:
      - redis-cache:/data

volumes:
  neo4j-data:
  neo4j-logs:
  redis-cache:
